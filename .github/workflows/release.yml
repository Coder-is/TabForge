name: GitHub delivery

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  delivery:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check tag and source identity
        run: |
          python -c 'import json,os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("release.json"))["version"]'
          go run ./cmd/release -check
      - run: npm ci --prefix sdk/typescript --ignore-scripts
      - run: python -m pip install setuptools wheel twine
      - run: npm --prefix sdk/typescript run check
      - run: npm --prefix sdk/typescript test
      - run: node --test editors/vscode/extension.test.cjs editors/cocos/runner.test.cjs
      - run: python -m unittest discover -s scripts -p test_verify_release.py -v
      - run: go test -race -count=1 ./...
      - name: Build clean delivery and verify manifest
        run: |
          go run ./cmd/release -python=python -require-clean -out=outputs/delivery
          python scripts/verify_release.py --out=outputs/delivery --integrity-only
          python -m twine check outputs/delivery/*.whl
          python scripts/prepare_publish.py --out=outputs/delivery --plan=outputs/publish-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.ref_name }}
          path: |
            outputs/delivery/
            outputs/publish-plan.json
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" outputs/delivery/* --verify-tag --title "TabForge $GITHUB_REF_NAME" --notes-file doc/release-notes.md --prerelease
