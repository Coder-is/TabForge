name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix sdk/typescript --ignore-scripts
      - run: npm --prefix sdk/typescript run check
      - run: npm --prefix sdk/typescript test
      - run: go test -race ./...
