name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --prefix sdk/typescript --ignore-scripts
      - run: npm --prefix sdk/typescript run check
      - run: npm --prefix sdk/typescript test
      - run: node --test editors/vscode/extension.test.cjs
      - run: node --test editors/cocos/runner.test.cjs
      - run: npm --prefix sdk/typescript run build:platforms
      - run: go run ./cmd/release -check
      - run: python scripts/run_ci_check.py go test -race ./...

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - name: Download verified Godot 4.5.1
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          printf '%s  %s\n' '5bccbed65a94b82c7c319fdb15719ee8113a6e503976cc54e16f1c61fe95f3d74e5e40b8449b5bb89ff7f424574c20af01a4f5ef08b389e4dc338b245185b0b9' "$RUNNER_TEMP/godot.zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Godot units and real Go integration
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.5.1-stable_linux.x86_64
        run: go test -race -count=1 ./protocol/httptransport ./clientbundle -run Godot

  backend-packages:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci --prefix sdk/typescript --ignore-scripts
      - run: python -m pip install setuptools wheel
      - run: python -m unittest discover -s scripts -p test_verify_release.py -v
      - run: go run ./cmd/package-backend -python=python
      - run: python scripts/run_ci_check.py python scripts/verify_backend.py

  release-delivery:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci --prefix sdk/typescript --ignore-scripts
      - run: python -m pip install setuptools wheel
      - name: Build and install native delivery
        shell: bash
        run: |
          target=darwin-x64
          if [ "$(uname -m)" = arm64 ]; then target=darwin-arm64; fi
          go run ./cmd/release -python=python -target="$target" -out=outputs/delivery
          python scripts/verify_release.py --out=outputs/delivery --integrity-only
      - uses: actions/upload-artifact@v4
        with:
          name: validated-delivery
          path: outputs/delivery/
          if-no-files-found: error

  native-cores:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: C++ parser and strict JSON with sanitizers
        shell: bash
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I sdk/unreal/Source/TabForgeProtocol/Public sdk/native/tests/sse_test.cpp -o "$RUNNER_TEMP/tabforge-sse-test"
          "$RUNNER_TEMP/tabforge-sse-test"
      - name: Go HTTP to TS callback adapters and C# core
        env:
          DOTNET_BIN: dotnet
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: go test -race -count=1 -v ./internal/platformtest ./clientbundle
